<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="1" stop-color="#0d2744"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity="0.28"/>
    </filter>
    <style>
      .title{font:700 46px Arial,sans-serif;fill:#fff}
      .sub{font:400 23px Arial,sans-serif;fill:#c8d8ea}
      .head{font:700 28px Arial,sans-serif;fill:#fff}
      .body{font:400 21px Arial,sans-serif;fill:#d8e4f0}
      .small{font:400 18px Arial,sans-serif;fill:#a9bdd2}
      .chip{fill:#6eb7ff;stroke:#d8efff;stroke-width:3}
      .hbm{fill:#9a7cff;stroke:#e1d8ff;stroke-width:2}
      .base{fill:#304d69;stroke:#8fb2d1;stroke-width:3}
      .lid{fill:#dfe9f2;stroke:#fff;stroke-width:3}
      .hot{fill:#ffbb55}
      .cool{fill:#64d7c6}
      .arrow{stroke:#f3f6fa;stroke-width:5;fill:none;marker-end:url(#m)}
    </style>
    <marker id="m" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#f3f6fa"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="800" y="70" text-anchor="middle" class="title">Rubin Ultra 4-Die: The Missing Manufacturing Route</text>
  <text x="800" y="108" text-anchor="middle" class="sub">Reported packaging fallback versus Cools LATC restoration path</text>

  <g filter="url(#shadow)">
    <rect x="65" y="155" rx="28" ry="28" width="455" height="660" fill="#112f4e" stroke="#315c82" stroke-width="3"/>
    <rect x="572" y="155" rx="28" ry="28" width="455" height="660" fill="#30263b" stroke="#6c557c" stroke-width="3"/>
    <rect x="1079" y="155" rx="28" ry="28" width="455" height="660" fill="#123b38" stroke="#3d817a" stroke-width="3"/>
  </g>

  <text x="292" y="205" text-anchor="middle" class="head">1. Original 4-Die Target</text>
  <text x="799" y="205" text-anchor="middle" class="head">2. Reported Fallback</text>
  <text x="1306" y="205" text-anchor="middle" class="head">3. Cools LATC Route</text>

  <!-- panel 1 -->
  <rect x="115" y="300" width="355" height="250" rx="18" class="base"/>
  <path d="M120 425 Q290 345 465 425" stroke="#ff7d7d" stroke-width="10" fill="none"/>
  <rect x="160" y="335" width="105" height="82" rx="8" class="chip"/>
  <rect x="320" y="335" width="105" height="82" rx="8" class="chip"/>
  <rect x="160" y="450" width="105" height="82" rx="8" class="chip"/>
  <rect x="320" y="450" width="105" height="82" rx="8" class="chip"/>
  <g class="hbm">
    <rect x="128" y="322" width="22" height="32" rx="3"/><rect x="270" y="322" width="22" height="32" rx="3"/><rect x="430" y="322" width="22" height="32" rx="3"/>
    <rect x="128" y="390" width="22" height="32" rx="3"/><rect x="270" y="390" width="22" height="32" rx="3"/><rect x="430" y="390" width="22" height="32" rx="3"/>
    <rect x="128" y="458" width="22" height="32" rx="3"/><rect x="270" y="458" width="22" height="32" rx="3"/><rect x="430" y="458" width="22" height="32" rx="3"/>
    <rect x="128" y="510" width="22" height="32" rx="3"/><rect x="270" y="510" width="22" height="32" rx="3"/><rect x="430" y="510" width="22" height="32" rx="3"/>
  </g>
  <text x="292" y="600" text-anchor="middle" class="body">4 near-reticle GPU dies</text>
  <text x="292" y="632" text-anchor="middle" class="body">16 HBM4E stacks</text>
  <text x="292" y="674" text-anchor="middle" class="body" fill="#ff9999">Multidirectional package warpage</text>
  <text x="292" y="710" text-anchor="middle" class="small">Contact loss · joint nonuniformity</text>
  <text x="292" y="739" text-anchor="middle" class="small">yield and manufacturability limit</text>

  <!-- arrow -->
  <path d="M520 485 L566 485" class="arrow"/>

  <!-- panel 2 -->
  <rect x="637" y="320" width="325" height="165" rx="18" class="base"/>
  <rect x="684" y="358" width="105" height="82" rx="8" class="chip"/>
  <rect x="814" y="358" width="105" height="82" rx="8" class="chip"/>
  <g class="hbm">
    <rect x="650" y="346" width="22" height="32" rx="3"/><rect x="932" y="346" width="22" height="32" rx="3"/>
    <rect x="650" y="414" width="22" height="32" rx="3"/><rect x="932" y="414" width="22" height="32" rx="3"/>
  </g>
  <line x1="665" y1="525" x2="934" y2="525" stroke="#a98cc1" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="799" y="582" text-anchor="middle" class="body">2-die package / split-scale approach</text>
  <text x="799" y="625" text-anchor="middle" class="body" fill="#d8b8ef">Manufacturability recovered</text>
  <text x="799" y="659" text-anchor="middle" class="small">but the original single-package</text>
  <text x="799" y="688" text-anchor="middle" class="small">4-die integration is not realized</text>
  <text x="799" y="742" text-anchor="middle" class="small">Reported industry response, not an NVIDIA confirmation</text>

  <!-- arrow -->
  <path d="M1027 485 L1073 485" class="arrow"/>

  <!-- panel 3 -->
  <rect x="1130" y="270" width="350" height="34" rx="8" class="lid"/>
  <text x="1305" y="294" text-anchor="middle" style="font:700 17px Arial,sans-serif;fill:#172b3b">MONOLITHIC PLANAR CONSTRAINT</text>
  <rect x="1128" y="325" width="355" height="250" rx="18" class="base"/>
  <rect x="1172" y="357" width="105" height="82" rx="8" class="chip"/>
  <rect x="1332" y="357" width="105" height="82" rx="8" class="chip"/>
  <rect x="1172" y="472" width="105" height="82" rx="8" class="chip"/>
  <rect x="1332" y="472" width="105" height="82" rx="8" class="chip"/>
  <rect x="1152" y="568" width="310" height="14" rx="7" class="hot"/>
  <path d="M1168 606 L1168 640 M1238 606 L1238 640 M1307 606 L1307 640 M1377 606 L1377 640 M1447 606 L1447 640" stroke="#64d7c6" stroke-width="8"/>
  <text x="1306" y="675" text-anchor="middle" class="body">Flat constraint through solder solidification</text>
  <text x="1306" y="709" text-anchor="middle" class="body">Joint-selective heating</text>
  <text x="1306" y="743" text-anchor="middle" class="body">Immediate conductive cooling</text>
  <text x="1306" y="782" text-anchor="middle" class="body" fill="#7ef0df">Restore the 4-die single-package route</text>

  <text x="800" y="865" text-anchor="middle" class="sub">Cools LATC — prevent warpage from being locked in during the bonding interval</text>
</svg>
